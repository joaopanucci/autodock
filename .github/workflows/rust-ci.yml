name: Rust lifecycle CI

on:
  pull_request:
  push:
    branches: [main, feature/005-container-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  native:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt

      # Formatting is platform independent; run it exactly once per workflow.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # Check the full Tauri workspace, without building or launching the app.
      # A stalled mirror must fail fast and retry instead of hanging the job.
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      # Cache downloaded sources only. Cargo.lock and registry checksums remain
      # authoritative; no target binaries, credentials, or broad restore keys.
      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}

      - name: Check workspace
        run: cargo check --workspace --locked

      # Lifecycle tests use simulated executors and subprocess helpers. Do not
      # start Docker, Compose, the desktop app, or any integration daemon here.
      - name: Test core
        run: cargo test -p autodock-core --locked

      - name: Ensure validation did not modify tracked files
        run: git diff --exit-code
