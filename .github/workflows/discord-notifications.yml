
name: Discord Community Notifications

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  pull_request_target:
    types: [opened, reopened, closed]
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Publish notification
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          PR_WEBHOOK: ${{ secrets.DISCORD_PULL_REQUESTS_WEBHOOK }}
          ISSUES_WEBHOOK: ${{ secrets.DISCORD_ISSUES_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          # GitHub Actions provides this variable automatically.
          event_path = os.environ["GITHUB_EVENT_PATH"]

          with open(event_path, encoding="utf-8") as f:
              event = json.load(f)

          name = os.environ["EVENT_NAME"]
          action = os.environ["EVENT_ACTION"]

          if name == "push":
              tag = os.environ["REF_NAME"]
              if not re.fullmatch(r"v[0-9A-Za-z.+-]{1,40}", tag):
                  raise SystemExit("Unexpected tag name")
              item = {
                  "name": tag,
                  "html_url": f"https://github.com/joaopanucci/autodock/releases/tag/{tag}",
              }
              hook = os.environ.get("RELEASE_WEBHOOK", "")
              title = "🏷️ Nova tag em build / New tag building"

          elif name == "release":
              item = event["release"]
              hook = os.environ.get("RELEASE_WEBHOOK", "")
              title = "🚀 Nova versão / New release"

          elif name == "pull_request_target":
              item = event["pull_request"]
              hook = os.environ.get("PR_WEBHOOK", "")

              if action == "closed":
                  if not item.get("merged"):
                      print("Closed without merge. Skipping.")
                      raise SystemExit(0)

                  title = "✅ PR mesclada / Pull request merged"

              elif action == "reopened":
                  title = "🔄 PR reaberta / Pull request reopened"

              else:
                  title = "🔀 Nova PR / New pull request"

          elif name == "issues":
              item = event["issue"]
              hook = os.environ.get("ISSUES_WEBHOOK", "")

              title = (
                  "🔄 Issue reaberta / Issue reopened"
                  if action == "reopened"
                  else "🐛 Nova issue / New issue"
              )

          else:
              print("Unsupported event. Skipping.")
              raise SystemExit(0)

          # Validate webhook configuration.
          if not hook:
              raise SystemExit(
                  "Missing Discord webhook secret for this event"
              )

          hook = hook.strip()

          if (
              not hook.startswith(
                  (
                      "https://discord.com/api/webhooks/",
                      "https://discordapp.com/api/webhooks/"
                  )
              )
              or '"' in hook
              or "'" in hook
          ):
              raise SystemExit(
                  "Invalid Discord webhook URL. Check GitHub Secrets."
              )

          # Validate repository URL.
          url = item["html_url"]

          if not url.startswith(
              "https://github.com/joaopanucci/autodock/"
          ):
              raise SystemExit("Unexpected repository URL")

          # Sanitize title.
          label = str(
              item.get("name")
              or item.get("title")
              or "AutoDock"
          ).replace("@", "＠")[:180]

          # Prepare Discord message.
          payload = json.dumps({
              "content": f"{title}\n**{label}**\n{url}",
              "allowed_mentions": {
                  "parse": []
              }
          }).encode("utf-8")

          # Send with retries.
          for attempt in range(3):
              request = urllib.request.Request(
                  hook,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "AutoDock-Discord-Actions"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:
                      print(
                          "Discord notification sent successfully.",
                          "HTTP",
                          response.status
                      )
                      break

              except urllib.error.HTTPError as error:
                  if error.code not in (
                      429, 500, 502, 503, 504
                  ):
                      print(
                          "Discord request failed.",
                          "HTTP",
                          error.code
                      )
                      raise

                  if attempt == 2:
                      raise

                  delay = min(2 ** attempt, 10)

                  if error.code == 429:
                      retry = error.headers.get("Retry-After")

                      if retry:
                          try:
                              delay = max(
                                  1,
                                  min(float(retry), 30)
                              )
                          except ValueError:
                              pass

                  print(
                      "Temporary Discord error.",
                      "Retrying in",
                      delay,
                      "seconds."
                  )

                  time.sleep(delay)

              except (
                  urllib.error.URLError,
                  TimeoutError
              ):
                  if attempt == 2:
                      raise

                  delay = 2 ** attempt
                  print("Network error. Retrying.")
                  time.sleep(delay)
          PY
