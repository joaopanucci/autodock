
name: Discord Community Notifications

on:
  release:
    types: [published]
  pull_request_target:
    types: [opened, reopened, closed]
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Publish notification
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PATH: ${{ github.event_path }}
          RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          PR_WEBHOOK: ${{ secrets.DISCORD_PULL_REQUESTS_WEBHOOK }}
          ISSUES_WEBHOOK: ${{ secrets.DISCORD_ISSUES_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          with open(os.environ["EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          name = os.environ["EVENT_NAME"]
          action = os.environ["EVENT_ACTION"]

          if name == "release":
              item = event["release"]
              hook = os.environ["RELEASE_WEBHOOK"]
              title = "🚀 Nova versão / New release"

          elif name == "pull_request_target":
              item = event["pull_request"]
              hook = os.environ["PR_WEBHOOK"]

              if action == "closed":
                  if not item.get("merged"):
                      print("Closed without merge. Skipping.")
                      raise SystemExit(0)
                  title = "✅ PR mesclada / Pull request merged"
              elif action == "reopened":
                  title = "🔄 PR reaberta / Pull request reopened"
              else:
                  title = "🔀 Nova PR / New pull request"

          elif name == "issues":
              item = event["issue"]
              hook = os.environ["ISSUES_WEBHOOK"]
              title = (
                  "🔄 Issue reaberta / Issue reopened"
                  if action == "reopened"
                  else "🐛 Nova issue / New issue"
              )

          else:
              raise SystemExit("Unsupported event")

          if not hook:
              raise SystemExit("Missing Discord webhook secret")

          url = item["html_url"]

          if not url.startswith(
              "https://github.com/joaopanucci/autodock/"
          ):
              raise SystemExit("Unexpected repository URL")

          label = str(
              item.get("name")
              or item.get("title")
              or "AutoDock"
          ).replace("@", "＠")[:180]

          payload = json.dumps({
              "content": f"{title}\n**{label}**\n{url}",
              "allowed_mentions": {"parse": []}
          }).encode("utf-8")

          for attempt in range(3):
              request = urllib.request.Request(
                  hook,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "AutoDock-Discord-Actions"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=15
                  ) as response:
                      print("Discord HTTP", response.status)
                      break

              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise

                  if attempt == 2:
                      raise

                  delay = min(2 ** attempt, 10)

                  if error.code == 429:
                      retry = error.headers.get("Retry-After")
                      if retry:
                          try:
                              delay = max(1, min(float(retry), 30))
                          except ValueError:
                              pass

                  print("Retrying Discord request")
                  time.sleep(delay)

              except (urllib.error.URLError, TimeoutError):
                  if attempt == 2:
                      raise
                  time.sleep(2 ** attempt)
          PY
