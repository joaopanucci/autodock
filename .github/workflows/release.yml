name: Build installers

# Manual runs build the installers and keep them as workflow artifacts.
# Pushing a tag like v0.3.0 also publishes a DRAFT GitHub release for review.
on:
  workflow_dispatch:
  push:
    tags: ['v*']


permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  build:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-2022
            args: --bundles nsis
            bundle: target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-24.04
            args: --bundles deb,appimage
            bundle: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          if [ "$RUNNER_OS" = "macOS" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin --toolchain "$RUSTUP_TOOLCHAIN"
          fi

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install frontend dependencies
        run: npm --prefix apps/desktop ci

      - name: Build installer
        env:
          # AppImage tooling runs without FUSE on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm --prefix apps/desktop run tauri build -- ${{ matrix.args }} -- --locked

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autodock-${{ runner.os }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true

      - name: Collect files and checksums
        run: |
          mkdir release-files
          find installers -type f -exec cp {} release-files/ \;
          cd release-files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create draft release or attach to the existing one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release-files/* --repo "$REPO" --draft --verify-tag \
              --title "AutoDock $TAG" \
              --notes "Instaladores não assinados. Veja o README para instruções de instalação e verifique o SHA256SUMS.txt."
          fi
