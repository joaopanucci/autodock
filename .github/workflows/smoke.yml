name: Smoke test installers

# Installs the published release on clean runners, opens the app, checks it keeps
# running and (Windows/Linux) saves a screenshot as a workflow artifact.
# Windows and macOS are installed through scripts/install.ps1 and scripts/install.sh,
# so those scripts are tested here too (checksum verification included).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (empty = latest release)
        default: ''
  push:
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/smoke.yml'

permissions:
  contents: read

env:
  # Empty means "latest release"; the install scripts resolve it themselves.
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    name: Windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install with scripts/install.ps1
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Version $env:TAG -NoLaunch
          # Downloads made by the script must carry no Mark of the Web (what triggers SmartScreen).
          $installed = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter autodock-desktop.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installed) { throw 'autodock-desktop.exe not found after install' }
          Write-Host "Installed: $($installed.FullName)"

      - name: Launch and capture
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Recurse -Filter autodock-desktop.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'autodock-desktop.exe not found after install' }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) { throw "App exited early with code $($proc.ExitCode)" }
          Write-Host "App is running (pid $($proc.Id)), window title: '$($proc.MainWindowTitle)'"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("$PWD\windows.png")
          Stop-Process -Id $proc.Id -Force

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-windows
          path: windows.png
          if-no-files-found: warn

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download installer
        run: |
          TAG="${TAG:-$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)}"
          gh release download "$TAG" --repo ${{ github.repository }} --pattern '*amd64.deb' --dir .

      - name: Install package and tools
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y ./AutoDock_*_amd64.deb xvfb scrot x11-utils openbox

      - name: Launch and capture
        env:
          # No GPU on the runner: make WebKitGTK paint in software.
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GDK_BACKEND: x11
        run: |
          xvfb-run -a --server-args="-screen 0 1360x860x24" bash -c '
            openbox > /dev/null 2>&1 &
            sleep 2
            autodock-desktop > app.log 2>&1 &
            PID=$!
            sleep 25
            xwininfo -root -tree >> app.log 2>&1 || true
            kill -0 "$PID" || { echo "App exited early"; cat app.log; exit 1; }
            echo "App is running (pid $PID)"
            scrot linux.png
            kill "$PID"
          '

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-linux
          path: |
            linux.png
            app.log
          if-no-files-found: warn

  macos:
    name: macOS (install script)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install with scripts/install.sh
        run: |
          [ -z "$TAG" ] || export AUTODOCK_VERSION="$TAG"
          AUTODOCK_NO_OPEN=1 bash scripts/install.sh

      - name: Check the install and launch it
        run: |
          APP=/Applications/AutoDock.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          # No quarantine attribute is what keeps Gatekeeper from showing the warning.
          if xattr -p com.apple.quarantine "$APP" 2>/dev/null; then
            echo "Quarantine attribute present"; exit 1
          fi
          open "$APP"
          sleep 12
          pgrep -x autodock-desktop || { echo "App did not stay running"; exit 1; }
          echo "App is running"
          pkill -x autodock-desktop || true
