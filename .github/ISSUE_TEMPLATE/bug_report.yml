name: 🐛 Relatar um problema
description: Algo não funcionou como esperado
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri o Assistente Docker
        2. Escolhi a pasta ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operacional
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do AutoDock
      placeholder: v0.1.1
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Versão do Docker
      placeholder: "Saída de `docker --version`"
  - type: textarea
    id: logs
    attributes:
      label: Mensagens de erro ou capturas de tela
      description: Cole o texto do erro ou arraste uma imagem. **Não inclua senhas ou chaves.**
