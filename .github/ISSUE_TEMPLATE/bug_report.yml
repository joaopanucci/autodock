name: 🐛 Report a problem
description: Something did not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Opened the Docker assistant
        2. Chose the folder ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AutoDock version
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version
      placeholder: "Output of `docker --version`"
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Paste the error text or drag in an image. **Do not include passwords or keys.**
