[package]
name = "autodock-core"
version = "0.4.0"
edition = "2021"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
which = "7"
tempfile = "3"
command-group = "5"
fs4 = "1.1.0"
getrandom = "0.4.3"
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
